}

function drawLogo(cx, cy, w, gap) {
  if (!logoReady) return;
  const h = w * LH / LW, sw = LW / 2; gap = gap || 0;
  ctx.drawImage(logo, 0, 0, sw, LH, cx - w / 2 - gap, cy - h / 2, w / 2, h);

}
// circular badge cut from one half of the logo (eagle = left, circuit = right)
function drawBadge(kind, x, y, r) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#0c2146'; ctx.fill();
  if (logoReady && kind !== 'patch') {
    ctx.save(); ctx.clip();
    if (kind === 'eagle') ctx.drawImage(logo, LW * .10, LH * .17, LW * .40, LH * .40, x - r, y - r, r * 2, r * 2);
    else ctx.drawImage(logo, LW * .50, LH * .12, LW * .40, LH * .40, x - r, y - r, r * 2, r * 2);
    ctx.restore();
  } else if (kind === 'patch') {
    ctx.fillStyle = '#e8c56a';
    ctx.fillRect(x - r * .2, y - r * .6, r * .4, r * 1.2); ctx.fillRect(x - r * .6, y - r * .2, r * 1.2, r * .4);
  }
  ctx.lineWidth = 2;
  ctx.strokeStyle = kind === 'eagle' ? '#dfe9f5' : kind === 'circuit' ? '#7fd4ff' : '#e8c56a';
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
  ctx.restore();
}
